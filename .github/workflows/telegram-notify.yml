name: Telegram Notification

on:
  push:
    branches: [main, develop]
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Push
        if: github.event_name == 'push'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *Push na ${{ github.ref_name }}*

            👤 *Autor:* ${{ github.actor }}
            📦 *Branch:* `${{ github.ref_name }}`
            📝 *Commit:* ${{ github.event.head_commit.message }}

            🔗 [Ver alterações](${{ github.event.compare }})

      - name: Notify Pull Request
        if: github.event_name == 'pull_request'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🔀 *Pull Request ${{ github.event.action }}*

            👤 *Autor:* ${{ github.event.pull_request.user.login }}
            📌 *Título:* ${{ github.event.pull_request.title }}
            📦 *Branch:* `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`

            🔗 [Ver PR](${{ github.event.pull_request.html_url }})

      - name: Notify Issue
        if: github.event_name == 'issues'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            📋 *Issue ${{ github.event.action }}*

            👤 *Autor:* ${{ github.event.issue.user.login }}
            📌 *Título:* ${{ github.event.issue.title }}

            🔗 [Ver Issue](${{ github.event.issue.html_url }})
