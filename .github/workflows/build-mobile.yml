name: Build Mobile (APK)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web & Sync Mobile
        run: pnpm build:web-mobile

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-gen-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Send APK to Telegram 🚀
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            Build gerada (branch: ${{ github.ref_name }})

            Push feito por: ${{ github.actor }}
            
            O arquivo .apk para teste está em anexo.
          document: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
